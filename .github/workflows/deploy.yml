# Builds crossfireengine.io and deploys it to Cloudflare Pages (project crossfire-astro).
#
# The docs come from the newest editor release: the editor's manual at that tag, the engine's API
# reference from the newest engine tag. Code examples are type-checked against that engine before
# anything is deployed.
#
# When it runs: pushes to main; by hand (Actions > Deploy > Run workflow); a repository_dispatch
# "editor-release" (the editor's release workflow sends one when it has a token for it); and every
# hour, when the newest editor release isn't the one the live site describes (/release.json).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [editor-release]
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  ODIN_VERSION: dev-2026-10
  EDITOR_REPO: bcrowe306/crossfire-editor
  ENGINE_REPO: bcrowe306/crossfire-engine

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.check.outputs.build }}
      editor: ${{ steps.check.outputs.editor }}
      engine: ${{ steps.check.outputs.engine }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          editor=$(gh api "repos/$EDITOR_REPO/releases?per_page=10" -q '[.[] | select(.draft | not)][0].tag_name')
          engine=$(git ls-remote --tags --sort=-v:refname "https://github.com/$ENGINE_REPO" 'v*' | grep -v '\^{}' | head -1 | sed 's#.*refs/tags/##')
          deployed=$(curl -fsS https://crossfireengine.io/release.json 2>/dev/null | jq -r '.tag // empty' || true)
          echo "Newest editor release: $editor; engine tag: $engine; live site: ${deployed:-none}"
          build=true
          if [[ "$EVENT" == schedule && "$editor" == "$deployed" ]]; then build=false; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "editor=$editor" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"

  deploy:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: crossfire_astro
      - name: The editor at its newest release (its manual)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.EDITOR_REPO }}
          ref: ${{ needs.check.outputs.editor }}
          path: odin_sdl_editor
          # The manual, and the plugin API its plugin examples import
          sparse-checkout: |
            docs
            plugin_api
      - name: The engine at its newest tag (the API reference, the examples' checks)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ENGINE_REPO }}
          ref: ${{ needs.check.outputs.engine }}
          path: odin_sdl_engine
      - name: Odin
        run: |
          curl -fsSL -o odin.tar.gz "https://github.com/odin-lang/Odin/releases/download/$ODIN_VERSION/odin-linux-amd64-$ODIN_VERSION.tar.gz"
          mkdir -p "$HOME/odin-x" && tar -xzf odin.tar.gz -C "$HOME/odin-x"
          dir=$(dirname "$(find "$HOME/odin-x" -maxdepth 3 -type f -name odin | head -1)")
          echo "$dir" >> "$GITHUB_PATH"
          "$dir/odin" version
      - name: Box2D (the engine refuses to compile without it)
        run: |
          git -C odin_sdl_engine submodule update --init --depth 1 third_party/box2d
          bash odin_sdl_engine/tools/build_box2d.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crossfire_astro/package-lock.json
      - name: Build
        working-directory: crossfire_astro
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm run docs
          npm run check:examples
          npm run build
      - name: Deploy to Cloudflare Pages
        working-directory: crossfire_astro
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=crossfire-astro --branch=main --commit-dirty=true
